name: Build & Merge EsMesh ESP32 Firmwares

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Board / MCU Environment (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - esp32s3_node
          - esp32_classic_node
          - esp32c3_node
          - esp32c6_node

jobs:
  build_firmware:
    name: Build Merged Firmware for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32s3_node
            chip: esp32s3
            name: ESP32-S3
          - target: esp32_classic_node
            chip: esp32
            name: ESP32-Classic
          - target: esp32c3_node
            chip: esp32c3
            name: ESP32-C3
          - target: esp32c6_node
            chip: esp32c6
            name: ESP32-C6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install -r firmware/requirements.txt

      - name: Build and Merge Firmware (${{ matrix.name }})
        if: ${{ github.event.inputs.target_env == 'all' || github.event.inputs.target_env == matrix.target || github.event_name != 'workflow_dispatch' }}
        working-directory: ./firmware
        run: |
          pio run -e ${{ matrix.target }}

      - name: Upload Merged Single Flash Binary
        if: ${{ github.event.inputs.target_env == 'all' || github.event.inputs.target_env == matrix.target || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: esmesh-${{ matrix.chip }}-merged-v1.0.0
          path: firmware/dist/esmesh_${{ matrix.chip }}_merged.bin
          if-no-files-found: ignore
