name: Build & Merge EsMesh ESP32 Firmwares

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build_firmware:
    name: Build Merged Firmware for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: esp32s3_node
            chip: esp32s3
            name: ESP32-S3
          - target: esp32_classic_node
            chip: esp32
            name: ESP32-Classic
          - target: esp32c3_node
            chip: esp32c3
            name: ESP32-C3
          - target: esp32c6_node
            chip: esp32c6
            name: ESP32-C6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build and Merge Firmware (${{ matrix.name }})
        working-directory: ./firmware
        run: |
          pio run -e ${{ matrix.target }}

      - name: Upload Merged Single Flash Binary
        uses: actions/upload-artifact@v4
        with:
          name: esmesh-${{ matrix.chip }}-merged-v1.0.0
          path: firmware/dist/esmesh_${{ matrix.chip }}_merged.bin
          if-no-files-found: error
