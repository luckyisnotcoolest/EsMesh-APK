[platformio]
default_envs = esp32s3_node
src_dir = src
include_dir = include

[env]
platform = espressif32 @ 6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
    painlessMesh/painlessMesh @ ^1.5.0
    bblanchon/ArduinoJson @ ^6.21.3
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.2.4

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_USE_WDT=0

; Custom post-action to automatically build merged binary (bootloader + partitions + app)
extra_scripts = post:merge_firmware.py

; -------------------------------------------------------------
; 1. ESP32-S3 (Default: Native USB CDC / OTG + Mesh Node / Gateway)
; -------------------------------------------------------------
[env:esp32s3_node]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ESMESH_CHIP_ESP32S3=1

; -------------------------------------------------------------
; 2. ESP32 Classic / ESP32-WROOM-32 / ESP32-WROVER
; -------------------------------------------------------------
[env:esp32_classic_node]
board = esp32dev
board_build.mcu = esp32
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D ESMESH_CHIP_ESP32=1

; -------------------------------------------------------------
; 3. ESP32-C3 (RISC-V Single Core, Low Power Mesh Node)
; -------------------------------------------------------------
[env:esp32c3_node]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ESMESH_CHIP_ESP32C3=1

; -------------------------------------------------------------
; 4. ESP32-C6 (RISC-V + Zigbee/Thread/Mesh Ready)
; -------------------------------------------------------------
[env:esp32c6_node]
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ESMESH_CHIP_ESP32C6=1
